# Quant lockscreen (hyprlock 0.9). Palette = hypr/themes/palette.lua.
# Unlock = your login password (PAM module "hyprlock" -> /etc/pam.d/hyprlock).

$bg      = rgba(1a1a26cc)
$surface = rgba(11111bdd)
$border  = rgba(474540ff)
$fg      = rgba(d5c89aff)
$fg50    = rgba(d5c89a99)
$accent  = rgba(89b4faff)
$red     = rgba(f38ba8ff)
$yellow  = rgba(f9e2afff)
$font    = JetBrainsMono Nerd Font
$info    = ~/.config/hypr-quant/bin/quant-lockinfo

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
}

background {
    monitor =
    path = /home/kryyo1441/Pictures/wallpapers/w3.jpg
    color = rgba(1a1a26ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.15
}

# --- top bar: weather (left), battery + power profile (right) ---------------
label {
    monitor =
    text = cmd[update:60000] $info weather
    color = $fg
    font_size = 13
    font_family = $font
    position = 30, -24
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] $info battery
    color = $fg
    font_size = 13
    font_family = $font
    position = -30, -24
    halign = right
    valign = top
}

# --- clock ------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $accent
    font_size = 18
    font_family = $font
    position = 0, 115
    halign = center
    valign = center
}

# --- user card + password ---------------------------------------------------
shape {
    monitor =
    size = 380, 150
    color = $bg
    rounding = 14
    border_size = 2
    border_color = $border
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $fg
    font_size = 15
    font_family = $font
    position = 0, -2
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 10
    inner_color = $surface
    outer_color = $border
    font_color = $fg
    font_family = $font
    check_color = $accent
    fail_color = $red
    capslock_color = $yellow
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##d5c89a99">password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    position = 0, -65
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $fg50
    font_size = 10
    font_family = $font
    position = 0, -135
    halign = center
    valign = center
}

# --- now playing ------------------------------------------------------------
label {
    monitor =
    text = cmd[update:2000] $info media
    color = $accent
    font_size = 12
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
