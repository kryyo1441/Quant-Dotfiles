; Quant desktop visualizer. Own config: ~/.config/cava is left alone.
[general]
framerate = 30
bars = 24
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
